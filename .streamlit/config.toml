[theme]
base = "light"
primaryColor = "#1F4FD8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FB"
textColor = "#0E1B2E"
borderColor = "#DCE3EC"
showWidgetBorder = true
baseRadius = "none"
buttonRadius = "none"
headingFontWeights = [800, 750, 700]
chartCategoricalColors = ["#1F4FD8", "#173FB0", "#5A6B80", "#7D9CF3", "#006B55"]
font = "Inter, sans-serif"
blueColor = "#1F4FD8"
blueBackgroundColor = "#E7EEFF"
blueTextColor = "#173FB0"
greenColor = "#006B55"
greenBackgroundColor = "#E7F5EF"
greenTextColor = "#006B55"
orangeColor = "#795100"
orangeBackgroundColor = "#FFF3DA"
orangeTextColor = "#795100"
redColor = "#972D32"
redBackgroundColor = "#FBEAED"
redTextColor = "#972D32"
grayColor = "#5A6B80"
grayBackgroundColor = "#F4F7FB"
grayTextColor = "#5A6B80"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/InterVariable.woff2"
weight = "100 900"
style = "normal"

[server]
headless = true
runOnSave = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
