[project]
name = "halvian"
version = "0.1.0"
description = "Halvian Bed Flow: synthetic-data prototype of an AI bed flow dashboard"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["context"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"pages/*.py" = ["E402"]
"app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
